<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FR.gg - 伺服器對戰極致版</title>
    <link rel="icon" type="image/jpeg" href="https://i.ibb.co/cXZ9bzt5/FR-gg.jpg">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #03050a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; position: fixed; }
        canvas { display: block; width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }

        .overlay-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 5, 10, 0.9); backdrop-filter: blur(20px);
            display: flex; justify-content: center; align-items: center; z-index: 10; color: white;
            animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }

        .panel {
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px; border-radius: 24px; width: 90%; max-width: 380px; text-align: center;
            box-shadow: 0 25px 60px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.1);
        }
        .panel h1 { font-size: 38px; margin-bottom: 20px; color: #00f2fe; text-shadow: 0 0 20px rgba(0,242,254,0.6); letter-spacing: 3px; }
        .input-group { margin-bottom: 16px; text-align: left; }
        .input-group label { display: block; font-size: 13px; margin-bottom: 6px; color: #8a99ad; font-weight: 700; letter-spacing: 0.5px; }
        .input-group input, .input-group select {
            width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #1e293b;
            background: #0a0f1d; color: #fff; font-size: 16px; outline: none; transition: all 0.3s;
        }
        .input-group input:focus, .input-group select:focus { border-color: #00f2fe; box-shadow: 0 0 10px rgba(0,242,254,0.3); }
        
        .btn-group { display: flex; gap: 12px; margin-top: 18px; }
        .btn {
            flex: 1; padding: 16px; border: none; border-radius: 12px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            color: white; font-weight: bold; font-size: 16px; cursor: pointer;
            box-shadow: 0 4px 20px rgba(0,242,254,0.4); transition: transform 0.15s, opacity 0.2s, box-shadow 0.2s;
        }
        .btn:active { transform: scale(0.97); box-shadow: 0 2px 10px rgba(0,242,254,0.2); }
        .btn-sec { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); box-shadow: none; }
        .btn-sec:hover { background: rgba(255,255,255,0.12); }

        #hud {
            position: absolute; top: 20px; left: 20px; z-index: 5;
            background: rgba(10, 15, 29, 0.6); border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 20px; border-radius: 14px; color: white; font-size: 15px; font-weight: 700;
            backdrop-filter: blur(12px); pointer-events: none; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        #hud span { color: #00f2fe; font-size: 18px; text-shadow: 0 0 8px rgba(0,242,254,0.5); }

        #leaderboard {
            position: absolute; top: 20px; right: 20px; z-index: 5;
            background: rgba(10, 15, 29, 0.6); border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 14px 18px; border-radius: 14px; color: white; width: 190px;
            backdrop-filter: blur(12px); pointer-events: none; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        #leaderboard h3 { font-size: 14px; letter-spacing: 2px; color: #00f2fe; margin-bottom: 10px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 6px; }
        #leaderboard ol { list-style: none; padding: 0; margin: 0; }
        #leaderboard li { font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; margin-bottom: 6px; color: #cbd5e1; }
        #leaderboard li.me { color: #ffeb3b; text-shadow: 0 0 6px rgba(255,235,59,0.4); }

        #status-msg { margin-top: 16px; font-size: 14px; color: #00f2fe; min-height: 20px; word-break: break-all; font-weight: 500; }
        
        #joystick-zone {
            position: absolute; bottom: 30px; left: 30px; width: 130px; height: 130px;
            border-radius: 50%; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.15);
            touch-action: none; z-index: 6; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        #joystick-knob {
            width: 52px; height: 52px; border-radius: 50%; background: rgba(0, 242, 254, 0.7);
            pointer-events: none; transition: transform 0.04s ease-out; box-shadow: 0 0 15px rgba(0,242,254,0.7);
        }
        #mobile-controls { position: absolute; bottom: 30px; right: 30px; display: flex; gap: 16px; z-index: 6; }
        .act-btn {
            width: 66px; height: 66px; border-radius: 50%; background: rgba(255,255,255,0.08);
            border: 2px solid rgba(255,255,255,0.25); color: white; font-weight: bold; font-size: 16px;
            display: flex; align-items: center; justify-content: center; backdrop-filter: blur(10px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.4); transition: transform 0.1s;
        }
        .act-btn:active { background: rgba(0, 242, 254, 0.5); border-color: #00f2fe; transform: scale(0.92); }

        @media (hover: hover) and (pointer: fine) {
            #joystick-zone, #mobile-controls { display: none !important; }
        }
    </style>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<body>

    <!-- 大廳登入畫面 -->
    <div id="lobby" class="overlay-screen">
        <div class="panel">
            <h1>FR.gg</h1>
            <div class="input-group">
                <label>玩家暱稱</label>
                <input type="text" id="nickname" placeholder="輸入名稱..." maxlength="12" value="菁英玩家">
            </div>
            <div class="input-group">
                <label>選擇伺服器分流</label>
                <select id="server-select">
                    <option value="1111">主伺服器🔥 (同步中...)</option>
                    <option value="2222">第二分流伺服器 (同步中...)</option>
                    <option value="3333">第三分流伺服器 (同步中...)</option>
                </select>
            </div>
            <div class="btn-group">
                <button class="btn" id="start-btn" onclick="connectToServer()">進入遊戲對戰</button>
            </div>
            <div id="status-msg"></div>

    <!-- 遊戲結束畫面 -->
    <div id="gameover" class="overlay-screen" style="display: none;">
        <div class="panel">
            <h1 style="color: #ff3366; text-shadow: 0 0 20px rgba(255,51,102,0.6);">遭到吞噬</h1>
            <p style="margin-bottom: 22px; color: #a0aec0; font-size: 16px;">最終累積得分: <span id="final-score" style="color: #ffeb3b; font-weight: bold; font-size: 22px;">0</span></p>
            <div style="display: flex; gap: 10px;">
                <button class="btn" onclick="respawn()">再次挑戰</button>
                <button class="btn btn-sec" onclick="returnToLobby()">返回大廳</button>
            </div>

    <div id="hud">目前質量: <span id="hud-mass">0</span></div>

    <div id="leaderboard">
        <h3>即時排行榜</h3>
        <ol id="rank-list"></ol>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="joystick-zone"><div id="joystick-knob"></div></div>
    <div id="mobile-controls">
        <div class="act-btn" id="btn-w">W</div>
        <div class="act-btn" id="btn-space">分</div>
    </div>

<script>
/* ==========================================================================
   1. 系統初始化與 Firebase 配置
   ========================================================================== */
const firebaseConfig = {
    apiKey: "AIzaSyCCzmZs22Omv_RPAW47QXyfJI05kItr7Bw",
    authDomain: "frgg-c5404.firebaseapp.com",
    databaseURL: "https://frgg-c5404-default-rtdb.asia-southeast1.firebasedatabase.app/",
    projectId: "frgg-c5404",
    storageBucket: "frgg-c5404.firebasestorage.app",
    messagingSenderId: "76341492532",
    appId: "1:76341492532:web:ebf177bbec9d97b5c00361",
    measurementId: "G-F9309K5K32"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// 即時監控各伺服器人數
const serverSelect = document.getElementById('server-select');
['1111', '2222', '3333'].forEach(serverCode => {
    db.ref(`servers/frgg_${serverCode}/players`).on('value', (snapshot) => {
        const players = snapshot.val() || {};
        const count = Object.keys(players).length;
        for (let i = 0; i < serverSelect.options.length; i++) {
            if (serverSelect.options[i].value === serverCode) {
                const baseName = serverCode === '1111' ? '主伺服器🔥' : `第${serverCode[0]}分流伺服器`;
                serverSelect.options[i].text = `${baseName} (${count}人在線)`;
            }
        }
    });
});

document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

/* ==========================================================================
   2. 遊戲全域常數與變數定義
   ========================================================================== */
const WORLD_SIZE = 6000;
const PADDING = 100;
const RADIUS_SCALE = 3.6;
const MAX_FOODS = 800;
const MAX_VIRUSES = 25;

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let dpr = window.devicePixelRatio || 1;

let camera = { x: WORLD_SIZE / 2, y: WORLD_SIZE / 2, scale: 1 };
let visualEffects = []; // 用於儲存爆炸或特效粒子

function resizeCanvas() {
    dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

let myName = "菁英玩家";
let myId = 'p_' + Math.random().toString(36).substring(2, 10);
let currentRoomId = '';
let isHost = false;

let gameState = { players: {}, foods: [], viruses: [], ejected: [] };
let playerOrder = [];
let localInput = { angle: 0, speed: 0, split: false, eject: false };
let lastSendTime = 0;
let hostInterval = null;
let stateListener = null;

let isPageVisible = true;
document.addEventListener('visibilitychange', () => {
    isPageVisible = !document.hidden;
});

function setStatus(msg) {
    document.getElementById('status-msg').innerText = msg;
}

/* ==========================================================================
   3. 連線與伺服器主持邏輯
   ========================================================================== */
function connectToServer() {
    myName = document.getElementById('nickname').value.trim() || "菁英玩家";
    let serverCode = document.getElementById('server-select').value;
    currentRoomId = 'frgg_' + serverCode;

    document.getElementById('start-btn').disabled = true;
    setStatus("正在建立高畫質安全連線...");

    const roomHostRef = db.ref(`servers/${currentRoomId}/hostId`);
    const playerRef = db.ref(`servers/${currentRoomId}/players/${myId}`);

    playerRef.onDisconnect().remove();

    roomHostRef.transaction((currentHost) => {
        if (!currentHost) {
            return myId;
        }
        return currentHost;
    }, (error, committed, snapshot) => {
        if (error) {
            setStatus("連線失敗，請檢查網路後重試");
            document.getElementById('start-btn').disabled = false;
            return;
        }

        const hostId = snapshot.val();
        isHost = (hostId === myId);

        if (isHost) {
            setStatus("您已成為本房伺服器主機，正在初始化世界...");
            initHostWorld();
        } else {
            setStatus("成功連線至對戰伺服器！");
        }

        respawnPlayerInDB();

        document.getElementById('lobby').style.display = 'none';
        document.getElementById('gameover').style.display = 'none';
        document.getElementById('start-btn').disabled = false;

        startSyncListener();
    });
}

function respawnPlayerInDB() {
    db.ref(`servers/${currentRoomId}/players/${myId}`).set({
        id: myId,
        name: myName,
        color: `hsl(${Math.random() * 360}, 85%, 55%)`,
        cells: [{
            x: Math.random() * (WORLD_SIZE - PADDING * 4) + PADDING * 2,
            y: Math.random() * (WORLD_SIZE - PADDING * 4) + PADDING * 2,
            mass: 30, vx: 0, vy: 0, splitTime: Date.now(), squish: 1
        }],
        input: { angle: 0, speed: 0, split: false, eject: false },
        lastSeen: Date.now()
    });
}

function initHostWorld() {
    const worldRef = db.ref(`servers/${currentRoomId}/worldState`);
    worldRef.once('value', (snapshot) => {
        let val = snapshot.val();
        if (!val || !val.foods || val.foods.length === 0) {
            let initialFoods = [];
            let initialViruses = [];
            for (let i = 0; i < MAX_FOODS; i++) initialFoods.push(createFood());
            for (let i = 0; i < MAX_VIRUSES; i++) initialViruses.push(createVirus());
            
            worldRef.set({
                foods: initialFoods,
                viruses: initialViruses,
                ejected: []
            });
        }
    });

    if (hostInterval) clearInterval(hostInterval);
    // 以 30 FPS 執行伺服器端物理判定
    hostInterval = setInterval(updateServerPhysics, 1000 / 30);
}

function startSyncListener() {
    if (stateListener) {
        db.ref(`servers/${currentRoomId}`).off('value', stateListener);
    }

    stateListener = db.ref(`servers/${currentRoomId}`).on('value', (snapshot) => {
        const data = snapshot.val();
        if (!data) return;

        gameState.players = data.players || {};
        gameState.foods = (data.worldState && data.worldState.foods) || [];
        gameState.viruses = (data.worldState && data.worldState.viruses) || [];
        gameState.ejected = (data.worldState && data.worldState.ejected) || [];

        playerOrder = Object.values(gameState.players)
            .map(p => ({ id: p.id, totalMass: (p.cells || []).reduce((s, c) => s + c.mass, 0) }))
            .sort((a, b) => b.totalMass - a.totalMass)
            .map(p => p.id);

        let me = gameState.players[myId];
        let lobbyVisible = document.getElementById('lobby').style.display !== 'none';
        let gameoverVisible = document.getElementById('gameover').style.display === 'flex';

        if (!me && !lobbyVisible && !gameoverVisible) {
            triggerGameOver(0);
        }
    });
}

/* ==========================================================================
   4. 伺服器端物理引擎與碰撞演算 (Host Physics Engine)
   ========================================================================== */
function updateServerPhysics() {
    if (!isHost) return;
    const now = Date.now();
    let players = gameState.players || {};
    let foods = gameState.foods || [];
    let viruses = gameState.viruses || [];
    let ejected = gameState.ejected || [];

    // 補充食物
    if (foods.length < MAX_FOODS) {
        let diff = MAX_FOODS - foods.length;
        for (let i = 0; i < diff; i++) foods.push(createFood());
    }

    Object.keys(players).forEach(pId => {
        let p = players[pId];
        if (!p || !p.cells) return;
        let input = p.input || { angle: 0, speed: 0, split: false, eject: false };

        // 吐出質量機制
        if (input.eject && now - (p.lastEject || 0) > 120) {
            p.cells.forEach(cell => {
                if (cell.mass >= 38) {
                    cell.mass -= 12;
                    let r = Math.sqrt(cell.mass) * RADIUS_SCALE;
                    ejected.push({
                        x: cell.x + Math.cos(input.angle) * (r + 14),
                        y: cell.y + Math.sin(input.angle) * (r + 14),
                        angle: input.angle, speed: 20, mass: 10, color: p.color
                    });
                }
            });
            p.lastEject = now;
            input.eject = false;
        }

        // 分裂機制
        if (input.split) {
            let availableSplits = 16 - p.cells.length;
            if (availableSplits > 0) {
                let newCells = [];
                for (let cell of p.cells) {
                    if (cell.mass >= 45 && newCells.length < availableSplits) {
                        cell.mass /= 2;
                        newCells.push({
                            x: cell.x, y: cell.y,
                            mass: cell.mass,
                            vx: Math.cos(input.angle) * 25, vy: Math.sin(input.angle) * 25,
                            splitTime: now, squish: 1.4
                        });
                        cell.splitTime = now;
                    }
                }
                p.cells.push(...newCells);
            }
            input.split = false;
        }

        let addedCells = [];
        p.cells.forEach(cell => {
            // 質量自然微幅衰減
            if (cell.mass > 30) cell.mass -= 0.002;
            let radius = Math.sqrt(cell.mass) * RADIUS_SCALE;
            let speed = Math.max(1.2, 9.0 - (radius * 0.025)) * (input.speed || 0);

            cell.x += Math.cos(input.angle) * speed + (cell.vx || 0);
            cell.y += Math.sin(input.angle) * speed + (cell.vy || 0);

            if (cell.vx) cell.vx *= 0.82;
            if (cell.vy) cell.vy *= 0.82;

            // 邊界限制
            cell.x = Math.max(radius, Math.min(WORLD_SIZE - radius, cell.x));
            cell.y = Math.max(radius, Math.min(WORLD_SIZE - radius, cell.y));

            // 緩衝動畫恢復
            if (cell.squish && cell.squish > 1) {
                cell.squish += (1 - cell.squish) * 0.1;
            }

            // 吃食物
            for (let i = foods.length - 1; i >= 0; i--) {
                let f = foods[i];
                if (Math.hypot(cell.x - f.x, cell.y - f.y) < radius) {
                    cell.mass += 1.2;
                    foods.splice(i, 1);
                }
            }

            // 吃吐出物
            for (let i = ejected.length - 1; i >= 0; i--) {
                let e = ejected[i];
                if (Math.hypot(cell.x - e.x, cell.y - e.y) < radius) {
                    cell.mass += e.mass;
                    ejected.splice(i, 1);
                }
            }

            // 病毒碰撞判定
            for (let i = 0; i < viruses.length; i++) {
                let v = viruses[i];
                if (cell.mass > v.radius && Math.hypot(cell.x - v.x, cell.y - v.y) < radius) {
                    let maxAllowed = 16 - (p.cells.length + addedCells.length);
                    if (maxAllowed > 0) {
                        let targetPieces = Math.min(maxAllowed + 1, Math.floor(cell.mass / 22));
                        if (targetPieces > 1) {
                            let splitMass = cell.mass / targetPieces;
                            cell.mass = splitMass;
                            for (let k = 1; k < targetPieces; k++) {
                                let a = (Math.PI * 2 / targetPieces) * k;
                                addedCells.push({
                                    x: cell.x, y: cell.y,
                                    mass: splitMass, vx: Math.cos(a) * 20, vy: Math.sin(a) * 20,
                                    splitTime: now, squish: 1.4
                                });
                            }
                        }
                    }
                    viruses[i] = createVirus();
                    break;
                }
            }
        });

        if (addedCells.length > 0) p.cells.push(...addedCells);
    });

    // 吐出物滑行阻尼
    ejected.forEach(e => {
        if (e.speed > 0.1) {
            e.x += Math.cos(e.angle) * e.speed;
            e.y += Math.sin(e.angle) * e.speed;
            e.speed *= 0.88;
        } else {
            e.speed = 0;
        }
    });

    // 玩家細胞互吃判定
    let allPlayers = Object.values(players);
    for (let i = 0; i < allPlayers.length; i++) {
        for (let j = 0; j < allPlayers.length; j++) {
            if (i === j) continue;
            let p1 = allPlayers[i], p2 = allPlayers[j];
            if (!p1.cells || !p2.cells) continue;

            p1.cells.forEach(c1 => {
                for (let k = p2.cells.length - 1; k >= 0; k--) {
                    let c2 = p2.cells[k];
                    if (c1.mass >= c2.mass * 1.12) {
                        let r1 = Math.sqrt(c1.mass) * RADIUS_SCALE;
                        let r2 = Math.sqrt(c2.mass) * RADIUS_SCALE;
                        let dist = Math.hypot(c1.x - c2.x, c1.y - c2.y);
                        if (dist < r1 - r2 * 0.25 || dist < r1 * 0.5) {
                            c1.mass += c2.mass;
                            p2.cells.splice(k, 1);
                        }
                    }
                }
            });
        }
    }

    // 清理無效細胞與玩家
    Object.keys(players).forEach(pId => {
        let p = players[pId];
        if (!p.cells || p.cells.length === 0) {
            delete players[pId];
            db.ref(`servers/${currentRoomId}/players/${pId}`).remove();
        }
    });

    db.ref(`servers/${currentRoomId}`).update({
        players: players,
        worldState: { foods, viruses, ejected }
    });
}

function respawn() {
    document.getElementById('gameover').style.display = 'none';
    respawnPlayerInDB();
}

function returnToLobby() {
    document.getElementById('gameover').style.display = 'none';
    document.getElementById('lobby').style.display = 'flex';
    document.getElementById('start-btn').disabled = false;
    setStatus("");

    if (currentRoomId && myId) {
        db.ref(`servers/${currentRoomId}/players/${myId}`).remove();
        if (isHost) {
            db.ref(`servers/${currentRoomId}/hostId`).remove();
            if (hostInterval) { clearInterval(hostInterval); hostInterval = null; }
        }
    }
    isHost = false;
}

function createFood() {
    return {
        x: Math.random() * (WORLD_SIZE - PADDING * 2) + PADDING,
        y: Math.random() * (WORLD_SIZE - PADDING * 2) + PADDING,
        color: `hsl(${Math.random() * 360}, 90%, 65%)`
    };
}

function createVirus() {
    return {
        x: Math.random() * (WORLD_SIZE - PADDING * 4) + PADDING * 2,
        y: Math.random() * (WORLD_SIZE - PADDING * 4) + PADDING * 2,
        radius: 50, mass: 110
    };
}

function triggerGameOver(score) {
    document.getElementById('final-score').innerText = Math.floor(score);
    document.getElementById('gameover').style.display = 'flex';
}

/* ==========================================================================
   5. 高畫質圖形繪製與動畫系統 (Canvas Rendering & Animation)
   ========================================================================== */
function drawBackground() {
    ctx.strokeStyle = '#0e1628';
    ctx.lineWidth = 1.5;
    let gridSize = 90;

    let startX = Math.floor((camera.x - window.innerWidth / camera.scale) / gridSize) * gridSize;
    let endX = Math.ceil((camera.x + window.innerWidth / camera.scale) / gridSize) * gridSize;
    let startY = Math.floor((camera.y - window.innerHeight / camera.scale) / gridSize) * gridSize;
    let endY = Math.ceil((camera.y + window.innerHeight / camera.scale) / gridSize) * gridSize;

    ctx.beginPath();
    for (let x = startX; x <= endX; x += gridSize) {
        ctx.moveTo(x, startY); ctx.lineTo(x, endY);
    }
    for (let y = startY; y <= endY; y += gridSize) {
        ctx.moveTo(startX, y); ctx.lineTo(endX, y);
    }
    ctx.stroke();
}

function drawVirus(x, y, radius) {
    ctx.save();
    ctx.fillStyle = '#1dc94c';
    ctx.strokeStyle = '#107a2c';
    ctx.lineWidth = 5;
    ctx.beginPath();
    let spikes = 18;
    let rot = Date.now() * 0.0008;
    for (let i = 0; i < spikes; i++) {
        let angle = (i / spikes) * Math.PI * 2 + rot;
        let r = (i % 2 === 0) ? radius : radius - 8;
        let vx = x + Math.cos(angle) * r;
        let vy = y + Math.sin(angle) * r;
        if (i === 0) ctx.moveTo(vx, vy); else ctx.lineTo(vx, vy);
    }
    ctx.closePath();
    ctx.shadowColor = '#1dc94c';
    ctx.shadowBlur = 15;
    ctx.fill();
    ctx.stroke();
    ctx.restore();
}

function updateLeaderboard() {
    const listEl = document.getElementById('rank-list');
    const sorted = Object.values(gameState.players || {}).map(p => ({
        id: p.id, name: p.name,
        totalMass: (p.cells || []).reduce((sum, c) => sum + c.mass, 0)
    })).sort((a, b) => b.totalMass - a.totalMass).slice(0, 5);

    let html = '';
    sorted.forEach((p, i) => {
        html += `<li class="${p.id === myId ? 'me' : ''}"><span>${i + 1}. ${p.name}</span><span>${Math.floor(p.totalMass)}</span></li>`;
    });
    listEl.innerHTML = html;
}

function render() {
    if (!isPageVisible) {
        requestAnimationFrame(render);
        return;
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    let me = gameState.players ? gameState.players[myId] : null;
    if (me && me.cells && me.cells.length > 0) {
        let avgX = me.cells.reduce((sum, c) => sum + c.x, 0) / me.cells.length;
        let avgY = me.cells.reduce((sum, c) => sum + c.y, 0) / me.cells.length;
        let totalMass = me.cells.reduce((sum, c) => sum + c.mass, 0);

        document.getElementById('hud-mass').innerText = Math.floor(totalMass);

        let targetScale = Math.max(0.2, 1 - (Math.sqrt(totalMass) * 0.0022));
        camera.scale += (targetScale - camera.scale) * 0.12;
        camera.x += (avgX - camera.x) * 0.15;
        camera.y += (avgY - camera.y) * 0.15;
    }

    ctx.save();
    ctx.scale(dpr, dpr);
    ctx.translate(window.innerWidth / 2, window.innerHeight / 2);
    ctx.scale(camera.scale, camera.scale);
    ctx.translate(-camera.x, -camera.y);

    drawBackground();

    // 繪製世界邊界護城河外框
    ctx.strokeStyle = '#00f2fe'; ctx.lineWidth = 10;
    ctx.shadowColor = '#00f2fe'; ctx.shadowBlur = 20;
    ctx.strokeRect(0, 0, WORLD_SIZE, WORLD_SIZE);
    ctx.shadowBlur = 0;

    let viewW = (window.innerWidth / camera.scale) / 2 + 120;
    let viewH = (window.innerHeight / camera.scale) / 2 + 120;

    // 繪製食物
    if (gameState.foods) {
        gameState.foods.forEach(f => {
            if (Math.abs(f.x - camera.x) < viewW && Math.abs(f.y - camera.y) < viewH) {
                ctx.fillStyle = f.color;
                ctx.beginPath(); ctx.arc(f.x, f.y, 6, 0, Math.PI * 2); ctx.fill();
            }
        });
    }

    // 繪製吐出物
    if (gameState.ejected) {
        gameState.ejected.forEach(e => {
            if (Math.abs(e.x - camera.x) < viewW && Math.abs(e.y - camera.y) < viewH) {
                ctx.fillStyle = e.color;
                ctx.beginPath(); ctx.arc(e.x, e.y, 9, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.stroke();
            }
        });
    }

    // 繪製病毒
    if (gameState.viruses) {
        gameState.viruses.forEach(v => {
            if (Math.abs(v.x - camera.x) < viewW + v.radius && Math.abs(v.y - camera.y) < viewH + v.radius) {
                drawVirus(v.x, v.y, v.radius);
            }
        });
    }

    // 收集並排序所有玩家細胞進行渲染 (小細胞在上，大細胞在下)
    let renderCells = [];
    if (gameState.players) {
        Object.values(gameState.players).forEach(p => {
            if (p.cells) {
                p.cells.forEach(c => renderCells.push({ ...c, color: p.color, name: p.name }));
            }
        });
    }
    renderCells.sort((a, b) => a.mass - b.mass);

    renderCells.forEach(c => {
        let r = Math.sqrt(c.mass) * RADIUS_SCALE;
        let sq = c.squish || 1;

        if (Math.abs(c.x - camera.x) < viewW + r && Math.abs(c.y - camera.y) < viewH + r) {
            ctx.save();
            ctx.translate(c.x, c.y);
            ctx.scale(sq, 1 / sq);

            // 細胞本體
            ctx.fillStyle = c.color;
            ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); 
            ctx.shadowColor = c.color;
            ctx.shadowBlur = 10;
            ctx.fill();
            
            // 細胞外框
            ctx.strokeStyle = 'rgba(255,255,255,0.9)';
            ctx.lineWidth = Math.max(3.5, r * 0.055);
            ctx.stroke();

            ctx.scale(1 / sq, sq);
            ctx.fillStyle = '#ffffff';
            ctx.shadowColor = 'rgba(0,0,0,0.9)';
            ctx.shadowBlur = 6;

            let nameSize = Math.max(11, Math.floor(r * 0.32));
            let massSize = Math.max(9, Math.floor(r * 0.24));

            ctx.font = `bold ${nameSize}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.fillText(c.name, 0, -(r * 0.08));
            ctx.font = `700 ${massSize}px sans-serif`;
            ctx.fillText(Math.floor(c.mass), 0, (r * 0.3));

            ctx.restore();
        }
    });

    ctx.restore();
    updateLeaderboard();

    requestAnimationFrame(render);
}
requestAnimationFrame(render);

/* ==========================================================================
   6. 使用者互動與控制機制 (Controls: Mouse & Touch)
   ========================================================================== */
window.addEventListener('mousemove', (e) => {
    let me = gameState.players ? gameState.players[myId] : null;
    if (me && me.cells && me.cells.length > 0) {
        let screenCenterX = window.innerWidth / 2;
        let screenCenterY = window.innerHeight / 2;
        let dx = e.clientX - screenCenterX;
        let dy = e.clientY - screenCenterY;
        let dist = Math.hypot(dx, dy);

        localInput.angle = Math.atan2(dy, dx);
        let maxSensitivityRadius = 160 * camera.scale;
        localInput.speed = Math.min(1, Math.max(0, dist / maxSensitivityRadius));

        sendInput();
    }
});

window.addEventListener('keydown', (e) => {
    if (e.repeat) return;
    if (e.code === 'KeyW') { localInput.eject = true; sendInput(true); }
    if (e.code === 'Space') { localInput.split = true; sendInput(true); }
});

const joyZone = document.getElementById('joystick-zone');
const joyKnob = document.getElementById('joystick-knob');
let joyTouchId = null;

joyZone.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (joyTouchId === null) {
        let touch = e.changedTouches[0];
        joyTouchId = touch.identifier;
        updateJoystick(touch);
    }
}, { passive: false });

joyZone.addEventListener('touchmove', (e) => {
    e.preventDefault();
    for (let i = 0; i < e.changedTouches.length; i++) {
        let touch = e.changedTouches[i];
        if (touch.identifier === joyTouchId) {
            updateJoystick(touch);
            break;
        }
    }
}, { passive: false });

function updateJoystick(touch) {
    let rect = joyZone.getBoundingClientRect();
    let centerX = rect.left + rect.width / 2;
    let centerY = rect.top + rect.height / 2;
    let dx = touch.clientX - centerX;
    let dy = touch.clientY - centerY;
    let dist = Math.hypot(dx, dy);
    let maxDist = rect.width / 2;
    let angle = Math.atan2(dy, dx);
    let limitDist = Math.min(dist, maxDist);

    joyKnob.style.transform = `translate(${Math.cos(angle)*limitDist}px, ${Math.sin(angle)*limitDist}px)`;
    localInput.angle = angle;
    localInput.speed = limitDist / maxDist;
    sendInput();
}

function resetJoystick(e) {
    for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === joyTouchId) {
            joyTouchId = null;
            joyKnob.style.transform = `translate(0px, 0px)`;
            localInput.speed = 0;
            sendInput(true);
            break;
        }
    }
}
joyZone.addEventListener('touchend', resetJoystick);
joyZone.addEventListener('touchcancel', resetJoystick);

document.getElementById('btn-w').addEventListener('touchstart', (e) => { e.preventDefault(); localInput.eject = true; sendInput(true); });
document.getElementById('btn-space').addEventListener('touchstart', (e) => { e.preventDefault(); localInput.split = true; sendInput(true); });

function sendInput(force = false) {
    const now = Date.now();
    if (force || now - lastSendTime > 35) {
        if (currentRoomId && myId) {
            db.ref(`servers/${currentRoomId}/players/${myId}/input`).set(localInput);
            lastSendTime = now;
        }
        localInput.eject = false;
        localInput.split = false;
    }
}
