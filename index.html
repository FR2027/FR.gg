<script>
const firebaseConfig = {
    apiKey: "AIzaSyCCzmZs22Omv_RPAW47QXyfJI05kItr7Bw",

    measurementId: "G-F9309K5K32"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const serverSelect = document.getElementById('server-select');
['1111', '2222', '3333'].forEach(serverCode => {
    db.ref(`servers/frgg_${serverCode}/players`).on('value', (snapshot) => {
        const players = snapshot.val() || {};
        const count = Object.keys(players).length;
        for (let i = 0; i < serverSelect.options.length; i++) {
            if (serverSelect.options[i].value === serverCode) {
                const baseName = serverCode === '1111' ? '主分流伺服器🔥' : `第${serverCode[0]}分流伺服器`;
                serverSelect.options[i].text = `${baseName} (${count}人)`;
            }
        }
    });
});

document.addEventListener('gesturestart', e => e.preventDefault());

const WORLD_SIZE = 5000;
const PADDING = 50;
const RADIUS_SCALE = 3.6;
const MAX_FOODS = 650;
const MAX_VIRUSES = 25;

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let dpr = window.devicePixelRatio || 1;

let camera = { x: WORLD_SIZE / 2, y: WORLD_SIZE / 2, scale: 1 };
let mouseScreenPos = { x: window.innerWidth / 2, y: window.innerHeight / 2 };

function resizeCanvas() {
    dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

let myName = "未命名玩家";
let myId = 'p_' + Math.random().toString(36).substring(2, 9);
let currentRoomId = '';
let currentServerCode = '';
let isHost = false;

let gameState = { players: {}, foods: [], viruses: [], ejected: [] };
let playerOrder = [];
let localInput = { angle: 0, speed: 0, split: false, eject: false };
let lastSendTime = 0;
let hostInterval = null;
let stateListener = null;

let isPageVisible = true;
document.addEventListener('visibilitychange', () => {
    isPageVisible = !document.hidden;
});

function setStatus(msg) {
    document.getElementById('status-msg').innerText = msg;
}

function connectToServer() {
    myName = document.getElementById('nickname').value.trim() || "未命名玩家";
    currentServerCode = document.getElementById('server-select').value;
    currentRoomId = 'frgg_' + currentServerCode;

    document.getElementById('start-btn').disabled = true;
    setStatus("正在連接伺服器分流...");

    const roomHostRef = db.ref(`servers/${currentRoomId}/hostId`);
    const playerRef = db.ref(`servers/${currentRoomId}/players/${myId}`);

    playerRef.onDisconnect().remove();

    const initialPlayerData = {
        id: myId,
        name: myName,
        color: `hsl(${Math.random() * 360}, 80%, 55%)`,
        cells: [{
            x: Math.random() * (WORLD_SIZE - PADDING * 2) + PADDING,
            y: Math.random() * (WORLD_SIZE - PADDING * 2) + PADDING,
            mass: 20, vx: 0, vy: 0, splitTime: 0, squish: 1
        }],
        input: { angle: 0, speed: 0, split: false, eject: false },
        lastSeen: Date.now()
    };

    playerRef.set(initialPlayerData).then(() => {
        roomHostRef.transaction((currentHost) => {
            if (!currentHost) {
                return myId;
            }
            return currentHost;
        }, (error, committed, snapshot) => {
            if (error) {
                setStatus("連線伺服器發生錯誤");
                document.getElementById('start-btn').disabled = false;
                return;
            }

            const hostId = snapshot.val();
            isHost = (hostId === myId);

            if (isHost) {
                setStatus("您已成為伺服器核心，初始化世界中...");
                initHostWorld();
            } else {
                setStatus("成功連線至伺服器端！");
            }

            document.getElementById('lobby').style.display = 'none';
            document.getElementById('start-btn').disabled = false;

            startSyncListener();
        });
    });
}

function initHostWorld() {
    const worldRef = db.ref(`servers/${currentRoomId}/worldState`);
    worldRef.once('value', (snapshot) => {
        let val = snapshot.val();
        if (!val || !val.foods || val.foods.length === 0) {
            let initialFoods = [];
            let initialViruses = [];
            for (let i = 0; i < MAX_FOODS; i++) initialFoods.push(createFood());
            for (let i = 0; i < MAX_VIRUSES; i++) initialViruses.push(createVirus());
            
            worldRef.set({
                foods: initialFoods,
                viruses: initialViruses,
                ejected: []
            });
        }
    });

    if (hostInterval) clearInterval(hostInterval);
    hostInterval = setInterval(updateServerPhysics, 1000 / 30);
}

function startSyncListener() {
    if (stateListener) {
        db.ref(`servers/${currentRoomId}`).off('value', stateListener);
    }

    stateListener = db.ref(`servers/${currentRoomId}`).on('value', (snapshot) => {
        const data = snapshot.val();
        if (!data) return;

        if (data.players) {
            const activePlayerIds = Object.keys(data.players);
            if (activePlayerIds.length > 0) {
                if (!data.hostId || !data.players[data.hostId]) {
                    const newHostId = activePlayerIds[0];
                    db.ref(`servers/${currentRoomId}/hostId`).set(newHostId);
                    if (newHostId === myId && !isHost) {
                        isHost = true;
                        if (!hostInterval) initHostWorld();
                    } else if (newHostId !== myId) {
                        isHost = false;
                        if (hostInterval) { clearInterval(hostInterval); hostInterval = null; }
                    }
                }
            }
        }

        gameState.players = data.players || {};
        gameState.foods = (data.worldState && data.worldState.foods) || [];
        gameState.viruses = (data.worldState && data.worldState.viruses) || [];
        gameState.ejected = (data.worldState && data.worldState.ejected) || [];

        let me = gameState.players[myId];
        if (!me && document.getElementById('lobby').style.display === 'none' && document.getElementById('gameover').style.display === 'none') {
            triggerGameOver(0);
        }
    });
}

function updateServerPhysics() {
    if (!isHost) return;
    const now = Date.now();
    let players = gameState.players || {};
    let foods = gameState.foods || [];
    let viruses = gameState.viruses || [];
    let ejected = gameState.ejected || [];

    if (foods.length < MAX_FOODS) {
        let diff = MAX_FOODS - foods.length;
        for (let i = 0; i < diff; i++) {
            foods.push(createFood());
        }
    }

    if (viruses.length < MAX_VIRUSES) {
        let diff = MAX_VIRUSES - viruses.length;
        for (let i = 0; i < diff; i++) {
            viruses.push(createVirus());
        }
    }

    Object.keys(players).forEach(pId => {
        let p = players[pId];
        if (!p || !p.cells) return;
        let input = p.input || { angle: 0, speed: 0, split: false, eject: false };

        if (input.eject && now - (p.lastEject || 0) > 100) {
            p.cells.forEach(cell => {
                if (cell.mass >= 32) {
                    cell.mass -= 13;
                    let r = Math.sqrt(cell.mass) * RADIUS_SCALE;
                    ejected.push({
                        x: cell.x + Math.cos(input.angle) * (r + 10),
                        y: cell.y + Math.sin(input.angle) * (r + 10),
                        angle: input.angle, speed: 20, mass: 12, color: p.color
                    });
                }
            });
            p.lastEject = now;
            db.ref(`servers/${currentRoomId}/players/${pId}/input/eject`).set(false);
        }

        if (input.split) {
            let availableSplits = 16 - p.cells.length;
            if (availableSplits > 0) {
                let newCells = [];
                for (let cell of [...p.cells]) {
                    if (cell.mass >= 36 && newCells.length < availableSplits) {
                        cell.mass /= 2;
                        cell.squish = 1.35;
                        newCells.push({
                            x: cell.x, y: cell.y,
                            mass: cell.mass,
                            vx: Math.cos(input.angle) * 24, vy: Math.sin(input.angle) * 24,
                            splitTime: now, squish: 1.35
                        });
                        cell.splitTime = now;
                    }
                }
                p.cells.push(...newCells);
            }
            db.ref(`servers/${currentRoomId}/players/${pId}/input/split`).set(false);
        }

        let addedCells = [];
        p.cells.forEach(cell => {
            if (cell.mass > 20) cell.mass -= 0.002;
            let radius = Math.sqrt(cell.mass) * RADIUS_SCALE;
            let speed = Math.max(1.6, 9 - (radius * 0.032)) * (input.speed || 0);

            cell.x += Math.cos(input.angle) * speed + (cell.vx || 0);
            cell.y += Math.sin(input.angle) * speed + (cell.vy || 0);

            if (cell.vx) cell.vx *= 0.88;
            if (cell.vy) cell.vy *= 0.88;

            cell.x = Math.max(radius + 10, Math.min(WORLD_SIZE - radius - 10, cell.x));
            cell.y = Math.max(radius + 10, Math.min(WORLD_SIZE - radius - 10, cell.y));

            for (let i = foods.length - 1; i >= 0; i--) {
                let f = foods[i];
                if (Math.hypot(cell.x - f.x, cell.y - f.y) < radius) {
                    cell.mass += 1;
                    foods.splice(i, 1);
                }
            }

            for (let i = ejected.length - 1; i >= 0; i--) {
                let e = ejected[i];
                if (Math.hypot(cell.x - e.x, cell.y - e.y) < radius) {
                    cell.mass += e.mass;
                    ejected.splice(i, 1);
                }
            }

            for (let i = 0; i < viruses.length; i++) {
                let v = viruses[i];
                if (cell.mass > v.radius && Math.hypot(cell.x - v.x, cell.y - v.y) < radius) {
                    let maxAllowed = 16 - (p.cells.length + addedCells.length);
                    if (maxAllowed > 0) {
                        let targetPieces = Math.min(maxAllowed + 1, Math.floor(cell.mass / 18));
                        if (targetPieces > 1) {
                            let splitMass = cell.mass / targetPieces;
                            cell.mass = splitMass;
                            for (let k = 1; k < targetPieces; k++) {
                                let a = (Math.PI * 2 / targetPieces) * k;
                                addedCells.push({
                                    x: cell.x, y: cell.y,
                                    mass: splitMass, vx: Math.cos(a) * 20, vy: Math.sin(a) * 20,
                                    splitTime: now, squish: 1.4
                                });
                            }
                        }
                    }
                    viruses[i] = createVirus();
                    break;
                }
            }
        });

        if (addedCells.length > 0) p.cells.push(...addedCells);
    });

    ejected.forEach(e => {
        if (e.speed > 0.1) {
            e.x += Math.cos(e.angle) * e.speed;
            e.y += Math.sin(e.angle) * e.speed;
            e.speed *= 0.86;
        } else {
            e.speed = 0;
        }
    });

    let allPlayerIds = Object.keys(players);
    for (let i = 0; i < allPlayerIds.length; i++) {
        for (let j = 0; j < allPlayerIds.length; j++) {
            let p1 = players[allPlayerIds[i]];
            let p2 = players[allPlayerIds[j]];
            if (!p1 || !p2 || !p1.cells || !p2.cells) continue;

            p1.cells.forEach(c1 => {
                for (let k = p2.cells.length - 1; k >= 0; k--) {
                    if (i === j && p1.cells.length === 1) continue;
                    let c2 = p2.cells[k];
                    if (c1.mass >= c2.mass * 1.12) {
                        let r1 = Math.sqrt(c1.mass) * RADIUS_SCALE;
                        let r2 = Math.sqrt(c2.mass) * RADIUS_SCALE;
                        let dist = Math.hypot(c1.x - c2.x, c1.y - c2.y);
                        if (dist < r1 - r2 * 0.35 || dist < r1 * 0.6) {
                            c1.mass += c2.mass;
                            p2.cells.splice(k, 1);
                        }
                    }
                }
            });
        }
    }

    Object.keys(players).forEach(pId => {
        let p = players[pId];
        if (!p.cells || p.cells.length === 0) {
            delete players[pId];
            db.ref(`servers/${currentRoomId}/players/${pId}`).remove();
        }
    });

    db.ref(`servers/${currentRoomId}`).update({
        players: players,
        worldState: { foods, viruses, ejected }
    });
}

function respawn() {
    document.getElementById('gameover').style.display = 'none';
    db.ref(`servers/${currentRoomId}/players/${myId}`).set({
        id: myId,
        name: myName,
        color: `hsl(${Math.random() * 360}, 80%, 55%)`,
        cells: [{
            x: Math.random() * (WORLD_SIZE - PADDING * 2) + PADDING,
            y: Math.random() * (WORLD_SIZE - PADDING * 2) + PADDING,
            mass: 20, vx: 0, vy: 0, splitTime: 0, squish: 1
        }],
        input: { angle: 0, speed: 0, split: false, eject: false },
        lastSeen: Date.now()
    });
}

function returnToLobby() {
    document.getElementById('gameover').style.display = 'none';
    document.getElementById('lobby').style.display = 'flex';
    document.getElementById('start-btn').disabled = false;
    setStatus("");

    if (currentRoomId && myId) {
        db.ref(`servers/${currentRoomId}/players/${myId}`).remove();
        if (isHost) {
            db.ref(`servers/${currentRoomId}/hostId`).remove();
            if (hostInterval) { clearInterval(hostInterval); hostInterval = null; }
        }
    }
    isHost = false;
}

function createFood() {
    return {
        x: Math.random() * (WORLD_SIZE - PADDING * 2) + PADDING,
        y: Math.random() * (WORLD_SIZE - PADDING * 2) + PADDING,
        color: `hsl(${Math.random() * 360}, 85%, 60%)`
    };
}

function createVirus() {
    return {
        x: Math.random() * (WORLD_SIZE - PADDING * 4) + PADDING * 2,
        y: Math.random() * (WORLD_SIZE - PADDING * 4) + PADDING * 2,
        radius: 48, mass: 100
    };
}

function triggerGameOver(score) {
    document.getElementById('final-score').innerText = Math.floor(score);
    document.getElementById('gameover').style.display = 'flex';
}

function drawBackground() {
    ctx.strokeStyle = '#12192d';
    ctx.lineWidth = 1;
    let gridSize = 80;

    let startX = Math.floor((camera.x - window.innerWidth / camera.scale) / gridSize) * gridSize;
    let endX = Math.ceil((camera.x + window.innerWidth / camera.scale) / gridSize) * gridSize;
    let startY = Math.floor((camera.y - window.innerHeight / camera.scale) / gridSize) * gridSize;
    let endY = Math.ceil((camera.y + window.innerHeight / camera.scale) / gridSize) * gridSize;

    ctx.beginPath();
    for (let x = startX; x <= endX; x += gridSize) {
        ctx.moveTo(x, startY); ctx.lineTo(x, endY);
    }
    for (let y = startY; y <= endY; y += gridSize) {
        ctx.moveTo(startX, y); ctx.lineTo(endX, y);
    }
    ctx.stroke();
}

function drawVirus(x, y, radius) {
    ctx.save();
    ctx.fillStyle = '#22cc44';
    ctx.strokeStyle = '#15882c';
    ctx.lineWidth = 5;
    ctx.beginPath();
    let spikes = 20;
    let rot = Date.now() * 0.001;
    for (let i = 0; i < spikes; i++) {
        let angle = (i / spikes) * Math.PI * 2 + rot;
        let r = (i % 2 === 0) ? radius : radius - 7;
        let vx = x + Math.cos(angle) * r;
        let vy = y + Math.sin(angle) * r;
        if (i === 0) ctx.moveTo(vx, vy); else ctx.lineTo(vx, vy);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
}

function updateLeaderboard() {
    const listEl = document.getElementById('rank-list');
    const sorted = Object.values(gameState.players || {}).map(p => ({
        id: p.id, name: p.name,
        totalMass: (p.cells || []).reduce((sum, c) => sum + c.mass, 0)
    })).sort((a, b) => b.totalMass - a.totalMass).slice(0, 5);

    let html = '';
    sorted.forEach((p, i) => {
        html += `<li class="${p.id === myId ? 'me' : ''}"><span>${i + 1}. ${p.name}</span><span>${Math.floor(p.totalMass)}</span></li>`;
    });
    listEl.innerHTML = html;
}

function updateMouseInput() {
    let me = gameState.players ? gameState.players[myId] : null;
    if (!me || !me.cells || me.cells.length === 0) return;

    let avgX = me.cells.reduce((sum, c) => sum + c.x, 0) / me.cells.length;
    let avgY = me.cells.reduce((sum, c) => sum + c.y, 0) / me.cells.length;

    let mouseWorldX = camera.x + (mouseScreenPos.x - window.innerWidth / 2) / camera.scale;
    let mouseWorldY = camera.y + (mouseScreenPos.y - window.innerHeight / 2) / camera.scale;

    let dx = mouseWorldX - avgX;
    let dy = mouseWorldY - avgY;
    let dist = Math.hypot(dx, dy);

    localInput.angle = Math.atan2(dy, dx);
    
    // 滑鼠距離角色極近時可完全停止移動（設為 0），否則隨距離放大速度
    if (dist < 15) {
        localInput.speed = 0;
    } else {
        localInput.speed = Math.min(1, dist / 100);
    }
    sendInput();
}

function render() {
    if (!isPageVisible) {
        requestAnimationFrame(render);
        return;
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    let me = gameState.players ? gameState.players[myId] : null;
    if (me && me.cells && me.cells.length > 0) {
        let avgX = me.cells.reduce((sum, c) => sum + c.x, 0) / me.cells.length;
        let avgY = me.cells.reduce((sum, c) => sum + c.y, 0) / me.cells.length;
        let totalMass = me.cells.reduce((sum, c) => sum + c.mass, 0);

        document.getElementById('hud-mass').innerText = Math.floor(totalMass);

        let targetScale = Math.max(0.25, 1 - (Math.sqrt(totalMass) * 0.0028));
        camera.scale += (targetScale - camera.scale) * 0.08;
        camera.x += (avgX - camera.x) * 0.12;
        camera.y += (avgY - camera.y) * 0.12;

        updateMouseInput();
    }

    ctx.save();
    ctx.scale(dpr, dpr);
    ctx.translate(window.innerWidth / 2, window.innerHeight / 2);
    ctx.scale(camera.scale, camera.scale);
    ctx.translate(-camera.x, -camera.y);

    drawBackground();

    ctx.strokeStyle = '#00f2fe'; ctx.lineWidth = 10;
    ctx.shadowColor = '#00f2fe'; ctx.shadowBlur = 15;
    ctx.strokeRect(0, 0, WORLD_SIZE, WORLD_SIZE);
    ctx.shadowBlur = 0;

    let viewW = (window.innerWidth / camera.scale) / 2 + 100;
    let viewH = (window.innerHeight / camera.scale) / 2 + 100;

    if (gameState.foods) {
        gameState.foods.forEach(f => {
            if (Math.abs(f.x - camera.x) < viewW && Math.abs(f.y - camera.y) < viewH) {
                ctx.fillStyle = f.color;
                ctx.beginPath(); ctx.arc(f.x, f.y, 5, 0, Math.PI * 2); ctx.fill();
            }
        });
    }

    if (gameState.ejected) {
        gameState.ejected.forEach(e => {
            if (Math.abs(e.x - camera.x) < viewW && Math.abs(e.y - camera.y) < viewH) {
                ctx.fillStyle = e.color;
                ctx.beginPath(); ctx.arc(e.x, e.y, 9, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
            }
        });
    }

    if (gameState.viruses) {
        gameState.viruses.forEach(v => {
            if (Math.abs(v.x - camera.x) < viewW + v.radius && Math.abs(v.y - camera.y) < viewH + v.radius) {
                drawVirus(v.x, v.y, v.radius);
            }
        });
    }

    let renderCells = [];
    if (gameState.players) {
        Object.values(gameState.players).forEach(p => {
            if (p.cells) {
                p.cells.forEach(c => renderCells.push({ ...c, color: p.color, name: p.name }));
            }
        });
    }
    renderCells.sort((a, b) => a.mass - b.mass);

    renderCells.forEach(c => {
        let r = Math.sqrt(c.mass) * RADIUS_SCALE;
        let sq = c.squish || 1;

        if (Math.abs(c.x - camera.x) < viewW + r && Math.abs(c.y - camera.y) < viewH + r) {
            ctx.save();
            ctx.translate(c.x, c.y);
            ctx.scale(sq, 1 / sq);

            ctx.fillStyle = c.color;
            ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
            
            ctx.strokeStyle = 'rgba(255,255,255,0.85)';
            ctx.lineWidth = Math.max(3, r * 0.06);
            ctx.stroke();

            ctx.scale(1 / sq, sq);
            ctx.fillStyle = '#ffffff';
            ctx.shadowColor = 'rgba(0,0,0,0.8)';
            ctx.shadowBlur = 4;

            let nameSize = Math.max(10, Math.floor(r * 0.32));
            let massSize = Math.max(8, Math.floor(r * 0.24));

            ctx.font = `bold ${nameSize}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.fillText(c.name, 0, -(r * 0.08));
            ctx.font = `600 ${massSize}px sans-serif`;
            ctx.fillText(Math.floor(c.mass), 0, (r * 0.28));

            ctx.restore();
        }
    });

    ctx.restore();
    updateLeaderboard();

    requestAnimationFrame(render);
}
requestAnimationFrame(render);

window.addEventListener('mousemove', (e) => {
    mouseScreenPos.x = e.clientX;
    mouseScreenPos.y = e.clientY;
});

window.addEventListener('keydown', (e) => {
    if (e.repeat) return;
    if (e.code === 'KeyW') { localInput.eject = true; sendInput(true); }
    if (e.code === 'Space') { localInput.split = true; sendInput(true); }
});

const joyZone = document.getElementById('joystick-zone');
const joyKnob = document.getElementById('joystick-knob');
let joyTouchId = null;

joyZone.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (joyTouchId === null) {
        let touch = e.changedTouches[0];
        joyTouchId = touch.identifier;
        updateJoystick(touch);
    }
}, { passive: false });

joyZone.addEventListener('touchmove', (e) => {
    e.preventDefault();
    for (let i = 0; i < e.changedTouches.length; i++) {
        let touch = e.changedTouches[i];
        if (touch.identifier === joyTouchId) {
            updateJoystick(touch);
            break;
        }
    }
}, { passive: false });

function updateJoystick(touch) {
    let rect = joyZone.getBoundingClientRect();
    let centerX = rect.left + rect.width / 2;
    let centerY = rect.top + rect.height / 2;
    let dx = touch.clientX - centerX;
    let dy = touch.clientY - centerY;
    let dist = Math.hypot(dx, dy);
    let maxDist = rect.width / 2;
    let angle = Math.atan2(dy, dx);
    let limitDist = Math.min(dist, maxDist);

    joyKnob.style.transform = `translate(${Math.cos(angle)*limitDist}px, ${Math.sin(angle)*limitDist}px)`;
    localInput.angle = angle;
    localInput.speed = limitDist / maxDist;
    sendInput();
}

function resetJoystick(e) {
    for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === joyTouchId) {
            joyTouchId = null;
            joyKnob.style.transform = `translate(0px, 0px)`;
            localInput.speed = 0;
            sendInput(true);
            break;
        }
    }
}
joyZone.addEventListener('touchend', resetJoystick);
joyZone.addEventListener('touchcancel', resetJoystick);

document.getElementById('btn-w').addEventListener('touchstart', (e) => { 
    e.preventDefault(); 
    localInput.eject = true; 
    sendInput(true); 
    setTimeout(() => { localInput.eject = false; }, 50);
});
document.getElementById('btn-space').addEventListener('touchstart', (e) => { 
    e.preventDefault(); 
    localInput.split = true; 
    sendInput(true); 
    setTimeout(() => { localInput.split = false; }, 50);
});

function sendInput(force = false) {
    const now = Date.now();
    if (force || now - lastSendTime > 20) {
        if (currentRoomId && myId) {
            db.ref(`servers/${currentRoomId}/players/${myId}/input`).set({
                angle: localInput.angle,
                speed: localInput.speed,
                split: localInput.split,
                eject: localInput.eject
            });
            lastSendTime = now;
        }
    }
}
</script>
