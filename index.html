<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #05070f; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; position: fixed; }
        canvas { display: block; width: 100vw; height: 100vh; position: absolute; top:0; left:0; z-index: 1; }

        .overlay-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 7, 15, 0.88); backdrop-filter: blur(16px);
            display: flex; justify-content: center; align-items: center; z-index: 10; color: white;
        }
        .panel {
            background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 26px; border-radius: 20px; width: 88%; max-width: 360px; text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);

        .panel h1 { font-size: 34px; margin-bottom: 18px; color: #00f2fe; text-shadow: 0 0 15px rgba(0,242,254,0.6); letter-spacing: 2px; }
        .input-group { margin-bottom: 14px; text-align: left; }
        .input-group label { display: block; font-size: 12px; margin-bottom: 6px; color: #8a99ad; font-weight: 600; }

            width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #2a354f;
            background: #0d1222; color: #fff; font-size: 15px; outline: none; transition: border 0.2s;
        }
        .input-group input:focus, .input-group select:focus { border-color: #00f2fe; }
        
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        .btn {
            flex: 1; padding: 14px; border: none; border-radius: 10px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            color: white; font-weight: bold; font-size: 15px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,242,254,0.3); transition: transform 0.1s, opacity 0.2s;
        }
        .btn:active { transform: scale(0.98); }
        .btn-sec { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); box-shadow: none; }

        #hud {
            position: absolute; top: 16px; left: 16px; z-index: 5;
            background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 16px; border-radius: 12px; color: white; font-size: 14px; font-weight: 700;
            backdrop-filter: blur(8px); pointer-events: none;
        }

        #leaderboard {
            position: absolute; top: 16px; right: 16px; z-index: 5;
            background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 16px; border-radius: 12px; color: white; width: 160px;
            backdrop-filter: blur(8px); pointer-events: none;
        }
        #leaderboard h3 { font-size: 13px; letter-spacing: 1.5px; color: #00f2fe; margin-bottom: 8px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px; }
        #leaderboard ol { list-style: none; padding: 0; margin: 0; }
        #leaderboard li { font-size: 12px; font-weight: 600; display: flex; justify-content: space-between; margin-bottom: 4px; color: #cbd5e1; }
        #leaderboard li.me { color: #ffeb3b; }

        #status-msg { margin-top: 14px; font-size: 13px; color: #00f2fe; min-height: 18px; word-break: break-all; }
        
        #joystick-zone {
            position: absolute; bottom: 25px; left: 25px; width: 110px; height: 110px;
            border-radius: 50%; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.2);
            touch-action: none; z-index: 6; display: flex; justify-content: center; align-items: center;
        }
        #joystick-knob {
            width: 44px; height: 44px; border-radius: 50%; background: rgba(0, 242, 254, 0.6);
            pointer-events: none; transition: transform 0.05s ease-out; box-shadow: 0 0 10px rgba(0,242,254,0.5);
        }
        #mobile-controls { position: absolute; bottom: 25px; right: 25px; display: flex; gap: 14px; z-index: 6; }
        .act-btn {
            width: 58px; height: 58px; border-radius: 50%; background: rgba(255,255,255,0.12);
            border: 2px solid rgba(255,255,255,0.3); color: white; font-weight: bold; font-size: 15px;
            display: flex; align-items: center; justify-content: center; backdrop-filter: blur(8px);
        }
        .act-btn:active { background: rgba(0, 242, 254, 0.5); border-color: #00f2fe; }

        @media (hover: hover) and (pointer: fine) {
            #joystick-zone, #mobile-controls { display: none !important; }
        }
    </style>

<body>

    <div id="lobby" class="overlay-screen">
        <div class="panel">

            <div class="input-group">

<script>
const firebaseConfig = {
    apiKey: "AIzaSyCCzmZs22Omv_RPAW47QXyfJI05kItr7Bw",
    authDomain: "frgg-c5404.firebaseapp.com",
    databaseURL: "https://frgg-c5404-default-rtdb.asia-southeast1.firebasedatabase.app/",
    projectId: "frgg-c5404",
    storageBucket: "frgg-c5404.firebasestorage.app",
    messagingSenderId: "76341492532",
    appId: "1:76341492532:web:ebf177bbec9d97b5c00361",
    measurementId: "G-F9309K5K32"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

const GAME_SIG = "FR_GG_V4_FIXED";
const WORLD_SIZE = 5000;
const PADDING = 50;
const RADIUS_SCALE = 3.6;
const RECOMBINE_TIME = 18000;
const MAX_FOODS = 650;

const PEER_CONFIG = {
    debug: 1,
    config: {
        iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' },
            { urls: 'stun:global.stun.twilio.com:3478' },
            { urls: 'turn:openrelay.metered.ca:80', username: 'openrelay', credential: 'openrelay' },
            { urls: 'turn:openrelay.metered.ca:443', username: 'openrelay', credential: 'openrelay' }
        ]
    }
};

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let dpr = window.devicePixelRatio || 1;

let camera = { x: WORLD_SIZE / 2, y: WORLD_SIZE / 2, scale: 1 };
let particles = [];
let mousePos = { x: window.innerWidth / 2, y: window.innerHeight / 2 };

function resizeCanvas() {
    dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

let peer = null, conn = null, isHost = false;
let myName = "未命名玩家";
let myId = 'p_' + Math.random().toString(36).substring(2, 9);
let currentRoomId = '';
let currentServerCode = '';

let gameState = { players: {}, foods: [], viruses: [], ejected: [] };
let playerOrder = [];
let localInput = { angle: 0, speed: 0, split: false, eject: false };
let lastSendTime = 0;

let hostInterval = null;
let heartbeatInterval = null;

let isPageVisible = true;
document.addEventListener('visibilitychange', () => {
    isPageVisible = !document.hidden;
});

function cleanUpTimers() {
    if (hostInterval) { clearInterval(hostInterval); hostInterval = null; }
    if (heartbeatInterval) { clearInterval(heartbeatInterval); heartbeatInterval = null; }
}

function setStatus(msg) {
    document.getElementById('status-msg').innerText = msg;
}

function connectToServer() {
    myName = document.getElementById('nickname').value.trim() || "未命名玩家";
    currentServerCode = document.getElementById('server-select').value;
    currentRoomId = 'frgg_' + currentServerCode;

    document.getElementById('start-btn').disabled = true;
    setStatus("正在檢查伺服器狀態...");

    cleanUpTimers();
    if (peer) { try { peer.destroy(); } catch(e){} peer = null; }

    const hostRef = db.ref(`servers/${currentRoomId}/hostId`);
    const playerPresenceRef = db.ref(`servers/${currentRoomId}/players/${myId}`);

    playerPresenceRef.onDisconnect().remove();
    playerPresenceRef.set({ name: myName, joinedAt: firebase.database.ServerValue.TIMESTAMP });

    // 使用一次性讀取 (.once) 來取代即時監聽，徹底避免 429 錯誤
    hostRef.once('value', (snapshot) => {
        let existingHostId = snapshot.val();
        if (!existingHostId) {
            claimHostAndStart(currentRoomId);
        } else {
            tryConnectToHost(existingHostId);
        }
    }, (error) => {
        setStatus("連線伺服器過載，請稍後再試");
        document.getElementById('start-btn').disabled = false;
    });
}

function claimHostAndStart(roomId) {
    isHost = true;
    myId = roomId;
    setStatus("分流伺服器建立中...");

    const hostRef = db.ref(`servers/${roomId}/hostId`);
    hostRef.set(myId);
    hostRef.onDisconnect().remove();

    db.ref(`servers/${roomId}/players/${myId}`).set({ name: myName, joinedAt: firebase.database.ServerValue.TIMESTAMP });
    db.ref(`servers/${roomId}/players/${myId}`).onDisconnect().remove();

    peer = new Peer(myId, PEER_CONFIG);

    peer.on('open', () => {
        setStatus("伺服器建立成功！");
        becomeHost(roomId);
        setTimeout(() => {
            document.getElementById('lobby').style.display = 'none';
            document.getElementById('start-btn').disabled = false;
        }, 500);
    });

    peer.on('error', (err) => {
        if (err.type === 'unavailable-id') {
            isHost = false;
            myId = 'p_' + Math.random().toString(36).substring(2, 9);
            peer = new Peer(myId, PEER_CONFIG);
            peer.on('open', () => tryConnectToHost(roomId));
        } else {
            setStatus("伺服器錯誤: " + err.type);
            document.getElementById('start-btn').disabled = false;
        }
    });
}

function tryConnectToHost(hostId) {
    isHost = false;
    setStatus(`正在連線至主機 (${hostId})...`);

    peer = new Peer(myId, PEER_CONFIG);

    peer.on('open', () => {
        conn = peer.connect(hostId, { metadata: { signature: GAME_SIG, clientName: myName }, reliable: true });
        setupClientConn(conn, hostId);
    });

    peer.on('error', () => {
        setStatus("無法連線至房機，切換為自行建立伺服器...");
        claimHostAndStart(currentRoomId);
    });
}

function setupClientConn(c) {
    let connectTimeout = setTimeout(() => {
        if (!c || !c.open) {
            setStatus("連線超時，嘗試切換為伺服器...");
            claimHostAndStart(currentRoomId);
        }
    }, 5000);

    c.on('open', () => {
        clearTimeout(connectTimeout);
        setStatus("成功加入遊戲！");
        c.send({ type: 'JOIN', name: myName });
        document.getElementById('lobby').style.display = 'none';
        document.getElementById('start-btn').disabled = false;

        heartbeatInterval = setInterval(() => {
            if (c && c.open) c.send({ type: 'PING' });
        }, 1500);
    });

    c.on('data', (data) => {
        if (data.type === 'STATE') {
            updateClientState(data.state);
            if (data.playerOrder) playerOrder = data.playerOrder;
        }
    });

    c.on('close', () => handleHostDisconnect());
    c.on('error', () => handleHostDisconnect());
}

function handleHostDisconnect() {
    if (isHost) return;
    setStatus("連線逾時，正在自動連接分流伺服器...");
    cleanUpTimers();
    if (peer) { try { peer.destroy(); } catch(e){} }
    
    setTimeout(() => {
        claimHostAndStart(currentRoomId);
    }, 1000);
}

function updateClientState(newState) {
    Object.keys(newState.players || {}).forEach(pId => {
        let pNew = newState.players[pId];
        let pOld = gameState.players ? gameState.players[pId] : null;
        if (pOld && pOld.cells) {
            pNew.cells.forEach((cNew, idx) => {
                let cOld = pOld.cells[idx];
                if (cOld && typeof cOld.renderX === 'number' && typeof cOld.renderY === 'number') {
                    cNew.renderX = cOld.renderX + (cNew.x - cOld.renderX) * 0.65;
                    cNew.renderY = cOld.renderY + (cNew.y - cOld.renderY) * 0.65;
                } else {
                    cNew.renderX = cNew.x; 
                    cNew.renderY = cNew.y;
                }
            });
        } else {
            pNew.cells.forEach(cNew => { cNew.renderX = cNew.x; cNew.renderY = cNew.y; });
        }
    });

    gameState = {
        players: newState.players || {},
        foods: newState.foods || [],
        viruses: newState.viruses || [],
        ejected: newState.ejected || []
    };
}

function becomeHost(roomId) {
    isHost = true;
    myId = roomId;

    if (!gameState.foods || gameState.foods.length === 0) {
        gameState.foods = [];
        gameState.viruses = [];
        gameState.ejected = [];
        for (let i = 0; i < MAX_FOODS; i++) gameState.foods.push(createFood());
        for (let i = 0; i < 20; i++) gameState.viruses.push(createVirus());
    }

    if (!playerOrder.includes(myId)) playerOrder.unshift(myId);
    gameState.players[myId] = gameState.players[myId] || createPlayer(myId, myName);

    peer.on('connection', (c) => {
        if (!c.metadata || c.metadata.signature !== GAME_SIG) { c.close(); return; }

        c.on('data', (data) => {
            if (data.type === 'PING') {
                if (gameState.players[c.peer]) gameState.players[c.peer].lastSeen = Date.now();
                return;
            }
            if (gameState.players[c.peer]) gameState.players[c.peer].lastSeen = Date.now();

            if (data.type === 'JOIN' || data.type === 'RESPAWN') {
                gameState.players[c.peer] = createPlayer(c.peer, data.name || c.metadata.clientName);
                if (!playerOrder.includes(c.peer)) playerOrder.push(c.peer);
            }
            if (data.type === 'INPUT' && gameState.players[c.peer]) {
                gameState.players[c.peer].input = data.input;
            }
        });

        c.on('close', () => removePlayer(c.peer));
        c.on('error', () => removePlayer(c.peer));
    });

    cleanUpTimers();
    hostInterval = setInterval(updateHostLogic, 1000 / 45);
}

function removePlayer(pId) {
    delete gameState.players[pId];
    playerOrder = playerOrder.filter(id => id !== pId);
    if (currentRoomId) {
        db.ref(`servers/${currentRoomId}/players/${pId}`).remove();
    }
}

function respawn() {
    document.getElementById('gameover').style.display = 'none';
    if (isHost) {
        gameState.players[myId] = createPlayer(myId, myName);
    } else if (conn && conn.open) {
        conn.send({ type: 'RESPAWN', name: myName });
    }
}

function returnToLobby() {
    document.getElementById('gameover').style.display = 'none';
    document.getElementById('lobby').style.display = 'flex';
    document.getElementById('start-btn').disabled = false;
    setStatus("");
    
    if (currentRoomId && myId) {
        db.ref(`servers/${currentRoomId}/players/${myId}`).remove();
        if (isHost) {
            db.ref(`servers/${currentRoomId}/hostId`).remove();
        }
    }

    cleanUpTimers();
    isHost = false;
    if (peer) peer.destroy();
}

function createPlayer(id, name) {
    return {
        id, name,
        color: `hsl(${Math.random() * 360}, 80%, 55%)`,
        cells: [{
            x: Math.random() * (WORLD_SIZE - PADDING * 2) + PADDING,
            y: Math.random() * (WORLD_SIZE - PADDING * 2) + PADDING,
            renderX: 0, renderY: 0,
            mass: 20, vx: 0, vy: 0, splitTime: 0, squish: 1
        }],
        input: { angle: 0, speed: 0, split: false, eject: false },
        lastSeen: Date.now()
    };
}

function createFood() {
    return {
        x: Math.random() * (WORLD_SIZE - PADDING * 2) + PADDING,
        y: Math.random() * (WORLD_SIZE - PADDING * 2) + PADDING,
        color: `hsl(${Math.random() * 360}, 85%, 60%)`
    };
}

function createVirus() {
    return {
        x: Math.random() * (WORLD_SIZE - PADDING * 4) + PADDING * 2,
        y: Math.random() * (WORLD_SIZE - PADDING * 4) + PADDING * 2,
        radius: 48, mass: 100
    };
}

function addParticles(x, y, color, count = 8) {
    for (let i = 0; i < count; i++) {
        let ang = Math.random() * Math.PI * 2;
        let spd = Math.random() * 5 + 2;
        particles.push({
            x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
            life: 1.0, color, size: Math.random() * 3 + 2
        });
    }
}

function updateHostLogic() {
    const now = Date.now();

    if (gameState.foods.length < MAX_FOODS) {
        let diff = MAX_FOODS - gameState.foods.length;
        for (let i = 0; i < diff; i++) {
            gameState.foods.push(createFood());
        }
    }

    Object.keys(gameState.players).forEach(pId => {
        if (pId !== myId && now - gameState.players[pId].lastSeen > 15000) {
            removePlayer(pId);
        }
    });

    Object.values(gameState.players).forEach(p => {
        let input = (p.id === myId) ? localInput : p.input;

        if (input.eject && now - (p.lastEject || 0) > 80) {
            p.cells.forEach(cell => {
                if (cell.mass >= 32) {
                    cell.mass -= 13;
                    let r = Math.sqrt(cell.mass) * RADIUS_SCALE;
                    gameState.ejected.push({
                        x: cell.x + Math.cos(input.angle) * (r + 10),
                        y: cell.y + Math.sin(input.angle) * (r + 10),
                        angle: input.angle, speed: 20, mass: 12, color: p.color
                    });
                }
            });
            p.lastEject = now;
            input.eject = false;
        }

        if (input.split) {
            let availableSplits = 16 - p.cells.length;
            if (availableSplits > 0) {
                let newCells = [];
                for (let cell of p.cells) {
                    if (cell.mass >= 36 && newCells.length < availableSplits) {
                        cell.mass /= 2;
                        cell.squish = 1.35;
                        newCells.push({
                            x: cell.x, y: cell.y, renderX: cell.x, renderY: cell.y,
                            mass: cell.mass,
                            vx: Math.cos(input.angle) * 24, vy: Math.sin(input.angle) * 24,
                            splitTime: now, squish: 1.35
                        });
                        cell.splitTime = now;
                    }
                }
                p.cells.push(...newCells);
            }
            input.split = false;
        }

        let addedCells = [];
        p.cells.forEach((cell) => {
            if (cell.mass > 20) cell.mass -= 0.002;

            let radius = Math.sqrt(cell.mass) * RADIUS_SCALE;
            let speed = Math.max(1.6, 9 - (radius * 0.032)) * (input.speed || 0);

            cell.x += Math.cos(input.angle) * speed + (cell.vx || 0);
            cell.y += Math.sin(input.angle) * speed + (cell.vy || 0);

            if (cell.vx) cell.vx *= 0.88;
            if (cell.vy) cell.vy *= 0.88;

            cell.x = Math.max(radius + 10, Math.min(WORLD_SIZE - radius - 10, cell.x));
            cell.y = Math.max(radius + 10, Math.min(WORLD_SIZE - radius - 10, cell.y));

            cell.renderX = cell.renderX ? cell.renderX + (cell.x - cell.renderX) * 0.6 : cell.x;
            cell.renderY = cell.renderY ? cell.renderY + (cell.y - cell.renderY) * 0.6 : cell.y;
            
            if (cell.squish && cell.squish > 1) cell.squish += (1 - cell.squish) * 0.1;

            for (let i = gameState.foods.length - 1; i >= 0; i--) {
                let f = gameState.foods[i];
                if (Math.hypot(cell.x - f.x, cell.y - f.y) < radius) {
                    cell.mass += 1;
                    gameState.foods.splice(i, 1);
                }
            }
            
            for (let i = gameState.ejected.length - 1; i >= 0; i--) {
                let e = gameState.ejected[i];
                if (Math.hypot(cell.x - e.x, cell.y - e.y) < radius) {
                    cell.mass += e.mass;
                    gameState.ejected.splice(i, 1);
                }
            }

            for (let i = 0; i < gameState.viruses.length; i++) {
                let v = gameState.viruses[i];
                if (cell.mass > v.radius && Math.hypot(cell.x - v.x, cell.y - v.y) < radius) {
                    let maxAllowed = 16 - (p.cells.length + addedCells.length);
                    if (maxAllowed > 0) {
                        let targetPieces = Math.min(maxAllowed + 1, Math.floor(cell.mass / 18));
                        if (targetPieces > 1) {
                            let splitMass = cell.mass / targetPieces;
                            cell.mass = splitMass;
                            for (let k = 1; k < targetPieces; k++) {
                                let a = (Math.PI * 2 / targetPieces) * k;
                                addedCells.push({
                                    x: cell.x, y: cell.y, renderX: cell.x, renderY: cell.y,
                                    mass: splitMass, vx: Math.cos(a) * 20, vy: Math.sin(a) * 20,
                                    splitTime: now, squish: 1.4
                                });
                            }
                        }
                    }
                    gameState.viruses[i] = createVirus();
                    addParticles(v.x, v.y, '#33ff33', 20);
                    break;
                }
            }
        });

        if (addedCells.length > 0) p.cells.push(...addedCells);

        for (let i = 0; i < p.cells.length; i++) {
            for (let j = i + 1; j < p.cells.length; j++) {
                let c1 = p.cells[i], c2 = p.cells[j];
                let dist = Math.hypot(c1.x - c2.x, c1.y - c2.y);
                let r1 = Math.sqrt(c1.mass) * RADIUS_SCALE, r2 = Math.sqrt(c2.mass) * RADIUS_SCALE;
                let minDist = r1 + r2;

                if (now - c1.splitTime > RECOMBINE_TIME && now - c2.splitTime > RECOMBINE_TIME) {
                    if (dist < r1) {
                        c1.mass += c2.mass;
                        c1.squish = 1.2;
                        p.cells.splice(j, 1);
                        j--;
                    }
                } else if (dist < minDist && dist > 0) {
                    let overlap = minDist - dist;
                    let nx = (c1.x - c2.x) / dist;
                    let ny = (c1.y - c2.y) / dist;
                    c1.x += nx * overlap * 0.15; c1.y += ny * overlap * 0.15;
                    c2.x -= nx * overlap * 0.15; c2.y -= ny * overlap * 0.15;
                }
            }
        }
    });

    gameState.ejected.forEach(e => {
        if (e.speed > 0.1) {
            e.x += Math.cos(e.angle) * e.speed;
            e.y += Math.sin(e.angle) * e.speed;
            e.speed *= 0.86;
        } else {
            e.speed = 0;
        }
    });

    let allPlayers = Object.values(gameState.players);
    for (let i = 0; i < allPlayers.length; i++) {
        for (let j = 0; j < allPlayers.length; j++) {
            if (i === j) continue;
            let p1 = allPlayers[i], p2 = allPlayers[j];

            p1.cells.forEach(c1 => {
                for (let k = p2.cells.length - 1; k >= 0; k--) {
                    let c2 = p2.cells[k];
                    if (c1.mass >= c2.mass * 1.12) {
                        let r1 = Math.sqrt(c1.mass) * RADIUS_SCALE;
                        let r2 = Math.sqrt(c2.mass) * RADIUS_SCALE;
                        let dist = Math.hypot(c1.x - c2.x, c1.y - c2.y);
                        
                        if (dist < r1 - r2 * 0.35 || dist < r1 * 0.6) {
                            c1.mass += c2.mass;
                            c1.squish = 1.25;
                            addParticles(c2.x, c2.y, p2.color, 16);
                            p2.cells.splice(k, 1);
                        }
                    }
                }
            });
        }
    }

    Object.keys(gameState.players).forEach(pId => {
        let p = gameState.players[pId];
        if (p.cells.length > 0) {
            p.lastScore = p.cells.reduce((sum, c) => sum + c.mass, 0);
        } else {
            if (pId === myId && document.getElementById('gameover').style.display !== 'flex') {
                triggerGameOver(p.lastScore || 0);
            }
            removePlayer(pId);
        }
    });

    if (peer && peer.connections) {
        Object.keys(peer.connections).forEach(pId => {
            peer.connections[pId].forEach(c => {
                if (c && c.open) c.send({ type: 'STATE', state: gameState, playerOrder });
            });
        });
    }
}

function triggerGameOver(score) {
    document.getElementById('final-score').innerText = Math.floor(score);
    document.getElementById('gameover').style.display = 'flex';
}

function drawBackground() {
    ctx.strokeStyle = '#12192d';
    ctx.lineWidth = 1;
    let gridSize = 80;

    let startX = Math.floor((camera.x - window.innerWidth / camera.scale) / gridSize) * gridSize;
    let endX = Math.ceil((camera.x + window.innerWidth / camera.scale) / gridSize) * gridSize;
    let startY = Math.floor((camera.y - window.innerHeight / camera.scale) / gridSize) * gridSize;
    let endY = Math.ceil((camera.y + window.innerHeight / camera.scale) / gridSize) * gridSize;

    ctx.beginPath();
    for (let x = startX; x <= endX; x += gridSize) {
        ctx.moveTo(x, startY); ctx.lineTo(x, endY);
    }
    for (let y = startY; y <= endY; y += gridSize) {
        ctx.moveTo(startX, y); ctx.lineTo(endX, y);
    }
    ctx.stroke();
}

function drawVirus(x, y, radius) {
    ctx.save();
    ctx.fillStyle = '#22cc44';
    ctx.strokeStyle = '#15882c';
    ctx.lineWidth = 5;
    ctx.beginPath();
    let spikes = 20;
    let rot = Date.now() * 0.001;
    for (let i = 0; i < spikes; i++) {
        let angle = (i / spikes) * Math.PI * 2 + rot;
        let r = (i % 2 === 0) ? radius : radius - 7;
        let vx = x + Math.cos(angle) * r;
        let vy = y + Math.sin(angle) * r;
        if (i === 0) ctx.moveTo(vx, vy); else ctx.lineTo(vx, vy);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
}

function updateHUD(totalMass) {
    document.getElementById('hud-mass').innerText = Math.floor(totalMass);
}

function updateLeaderboard() {
    const listEl = document.getElementById('rank-list');
    const sorted = Object.values(gameState.players || {}).map(p => ({
        id: p.id, name: p.name,
        totalMass: p.cells.reduce((sum, c) => sum + c.mass, 0)
    })).sort((a, b) => b.totalMass - a.totalMass).slice(0, 5);

    let html = '';
    sorted.forEach((p, i) => {
        html += `<li class="${p.id === myId ? 'me' : ''}"><span>${i + 1}. ${p.name}</span><span>${Math.floor(p.totalMass)}</span></li>`;
    });
    listEl.innerHTML = html;
}

function render() {
    if (!isPageVisible) {
        requestAnimationFrame(render);
        return;
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    let me = gameState.players ? gameState.players[myId] : null;
    if (me && me.cells && me.cells.length > 0) {
        let avgX = me.cells.reduce((sum, c) => sum + (c.renderX || c.x), 0) / me.cells.length;
        let avgY = me.cells.reduce((sum, c) => sum + (c.renderY || c.y), 0) / me.cells.length;
        let totalMass = me.cells.reduce((sum, c) => sum + c.mass, 0);

        updateHUD(totalMass);

        let targetScale = Math.max(0.25, 1 - (Math.sqrt(totalMass) * 0.0028));
        camera.scale += (targetScale - camera.scale) * 0.08;
        camera.x += (avgX - camera.x) * 0.12;
        camera.y += (avgY - camera.y) * 0.12;
    }

    ctx.save();
    ctx.scale(dpr, dpr);

    ctx.translate(window.innerWidth / 2, window.innerHeight / 2);
    ctx.scale(camera.scale, camera.scale);
    ctx.translate(-camera.x, -camera.y);

    drawBackground();

    ctx.strokeStyle = '#00f2fe'; ctx.lineWidth = 10;
    ctx.shadowColor = '#00f2fe'; ctx.shadowBlur = 15;
    ctx.strokeRect(0, 0, WORLD_SIZE, WORLD_SIZE);
    ctx.shadowBlur = 0;

    let viewW = (window.innerWidth / camera.scale) / 2 + 100;
    let viewH = (window.innerHeight / camera.scale) / 2 + 100;

    if (gameState.foods) {
        gameState.foods.forEach(f => {
            if (Math.abs(f.x - camera.x) < viewW && Math.abs(f.y - camera.y) < viewH) {
                ctx.fillStyle = f.color;
                ctx.beginPath(); ctx.arc(f.x, f.y, 5, 0, Math.PI * 2); ctx.fill();
            }
        });
    }

    if (gameState.ejected) {
        gameState.ejected.forEach(e => {
            if (Math.abs(e.x - camera.x) < viewW && Math.abs(e.y - camera.y) < viewH) {
                ctx.fillStyle = e.color;
                ctx.beginPath(); ctx.arc(e.x, e.y, 9, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
            }
        });
    }

    if (gameState.viruses) {
        gameState.viruses.forEach(v => {
            if (Math.abs(v.x - camera.x) < viewW + v.radius && Math.abs(v.y - camera.y) < viewH + v.radius) {
                drawVirus(v.x, v.y, v.radius);
            }
        });
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        let pt = particles[i];
        ctx.fillStyle = pt.color;
        ctx.globalAlpha = pt.life;
        ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2); ctx.fill();
        pt.x += pt.vx; pt.y += pt.vy;
        pt.life -= 0.03;
        if (pt.life <= 0) particles.splice(i, 1);
    }
    ctx.globalAlpha = 1.0;

    let renderCells = [];
    if (gameState.players) {
        Object.values(gameState.players).forEach(p => {
            if (p.cells) {
                p.cells.forEach(c => renderCells.push({ ...c, color: p.color, name: p.name }));
            }
        });
    }
    renderCells.sort((a, b) => a.mass - b.mass);

    renderCells.forEach(c => {
        let rx = c.renderX || c.x;
        let ry = c.renderY || c.y;
        let r = Math.sqrt(c.mass) * RADIUS_SCALE;
        let sq = c.squish || 1;

        if (Math.abs(rx - camera.x) < viewW + r && Math.abs(ry - camera.y) < viewH + r) {
            ctx.save();
            ctx.translate(rx, ry);
            ctx.scale(sq, 1 / sq);

            ctx.fillStyle = c.color;
            ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
            
            ctx.strokeStyle = 'rgba(255,255,255,0.85)';
            ctx.lineWidth = Math.max(3, r * 0.06);
            ctx.stroke();

            ctx.scale(1 / sq, sq);
            ctx.fillStyle = '#ffffff';
            ctx.shadowColor = 'rgba(0,0,0,0.8)';
            ctx.shadowBlur = 4;

            let nameSize = Math.max(10, Math.floor(r * 0.32));
            let massSize = Math.max(8, Math.floor(r * 0.24));

            ctx.font = `bold ${nameSize}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.fillText(c.name, 0, -(r * 0.08));
            ctx.font = `600 ${massSize}px sans-serif`;
            ctx.fillText(Math.floor(c.mass), 0, (r * 0.28));

            ctx.restore();
        }
    });

    ctx.restore();
    updateLeaderboard();

    requestAnimationFrame(render);
}
requestAnimationFrame(render);

window.addEventListener('mousemove', (e) => {
    mousePos.x = e.clientX;
    mousePos.y = e.clientY;

    let me = gameState.players ? gameState.players[myId] : null;
    if (me && me.cells && me.cells.length > 0) {
        let screenCenterX = window.innerWidth / 2;
        let screenCenterY = window.innerHeight / 2;
        
        let dx = e.clientX - screenCenterX;
        let dy = e.clientY - screenCenterY;
        let dist = Math.hypot(dx, dy);

        localInput.angle = Math.atan2(dy, dx);
        let maxSensitivityRadius = 150 * camera.scale;
        localInput.speed = Math.min(1, Math.max(0, dist / maxSensitivityRadius));

        sendInput();
    }
});

window.addEventListener('keydown', (e) => {
    if (e.repeat) return;
    if (e.code === 'KeyW') { localInput.eject = true; sendInput(true); }
    if (e.code === 'Space') { localInput.split = true; sendInput(true); }
});

const joyZone = document.getElementById('joystick-zone');
const joyKnob = document.getElementById('joystick-knob');
let joyTouchId = null;

joyZone.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (joyTouchId === null) {
        let touch = e.changedTouches[0];
        joyTouchId = touch.identifier;
        updateJoystick(touch);
    }
}, { passive: false });

joyZone.addEventListener('touchmove', (e) => {
    e.preventDefault();
    for (let i = 0; i < e.changedTouches.length; i++) {
        let touch = e.changedTouches[i];
        if (touch.identifier === joyTouchId) {
            updateJoystick(touch);
            break;
        }
    }
}, { passive: false });

function updateJoystick(touch) {
    let rect = joyZone.getBoundingClientRect();
    let centerX = rect.left + rect.width / 2;
    let centerY = rect.top + rect.height / 2;
    
    let dx = touch.clientX - centerX;
    let dy = touch.clientY - centerY;
    let dist = Math.hypot(dx, dy);
    let maxDist = rect.width / 2;
    let angle = Math.atan2(dy, dx);
    let limitDist = Math.min(dist, maxDist);

    joyKnob.style.transform = `translate(${Math.cos(angle)*limitDist}px, ${Math.sin(angle)*limitDist}px)`;
    localInput.angle = angle;
    localInput.speed = limitDist / maxDist;
    sendInput();
}

function resetJoystick(e) {
    for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === joyTouchId) {
            joyTouchId = null;
            joyKnob.style.transform = `translate(0px, 0px)`;
            localInput.speed = 0;
            sendInput(true);
            break;
        }
    }
}
joyZone.addEventListener('touchend', resetJoystick);
joyZone.addEventListener('touchcancel', resetJoystick);

document.getElementById('btn-w').addEventListener('touchstart', (e) => { e.preventDefault(); localInput.eject = true; sendInput(true); });
document.getElementById('btn-space').addEventListener('touchstart', (e) => { e.preventDefault(); localInput.split = true; sendInput(true); });

function sendInput(force = false) {
    const now = Date.now();
    if (force || now - lastSendTime > 15) {
        if (!isHost && conn && conn.open) {
            conn.send({ type: 'INPUT', input: localInput });
            lastSendTime = now;
        }
        localInput.eject = false;
        localInput.split = false;
    }
}
</script>
